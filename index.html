<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的 AI 3D 總部</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#161b2d; --card:rgba(255,248,238,.95); --ink:#2b2119; --muted:#7a6a5c;
  --line:rgba(43,33,25,.12); --amber:#f2a541; --teal:#3aa6a0; --coral:#e86f55;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:'Noto Sans TC',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
body.day{--bg:#efe4d3}
#c{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}
#c.hover{cursor:pointer}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;pointer-events:auto;cursor:pointer;
  background:var(--card);border-radius:999px;padding:7px 14px 7px 11px;font-weight:700;font-size:13px;letter-spacing:.02em;
  box-shadow:0 6px 18px rgba(0,0,0,.25);display:flex;align-items:center;gap:7px;transition:transform .2s, box-shadow .2s;user-select:none}
.lbl:hover{box-shadow:0 8px 24px rgba(0,0,0,.35)}
.lbl i{width:9px;height:9px;border-radius:50%;display:block;flex:none}
.lbl small{font-weight:500;color:var(--muted);font-size:11px}
.st{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;pointer-events:none;
  background:rgba(32,24,18,.88);color:#fbefdc;border-radius:8px;padding:4px 9px;font-size:11.5px;font-weight:500;
  opacity:0;transition:opacity .35s;border:1px solid rgba(255,255,255,.12)}
.st.on{opacity:1}
.st::after{content:"";position:absolute;left:50%;bottom:-5px;width:8px;height:8px;background:rgba(32,24,18,.88);transform:translateX(-50%) rotate(45deg);border-right:1px solid rgba(255,255,255,.12);border-bottom:1px solid rgba(255,255,255,.12)}

header{position:fixed;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.brand{pointer-events:auto;background:var(--card);border-radius:18px;padding:12px 18px;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.brand h1{margin:0;font-size:19px;font-weight:900;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.brand h1 b{display:inline-block;width:12px;height:12px;border-radius:4px;background:linear-gradient(135deg,var(--amber),var(--coral));transform:rotate(45deg)}
.brand p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.tools{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
.tools button,#tabs button{font:inherit;border:0;cursor:pointer;background:var(--card);color:var(--ink);border-radius:999px;padding:9px 15px;font-size:13px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.2);transition:transform .15s}
.tools button:hover,#tabs button:hover{transform:translateY(-1px)}
.tools button.on{background:var(--ink);color:#fbefdc}

#panel{position:fixed;top:92px;right:16px;bottom:84px;width:350px;background:var(--card);border-radius:22px;box-shadow:0 16px 40px rgba(0,0,0,.3);
  transform:translateX(calc(100% + 30px));transition:transform .45s cubic-bezier(.2,.8,.2,1);overflow:auto;padding:22px 22px 26px}
#panel.open{transform:none}
#panel .x{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(43,33,25,.07);cursor:pointer;font-size:16px;color:var(--ink)}
.kicker{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.14em;display:flex;align-items:center;gap:8px}
.kicker i{width:22px;height:4px;border-radius:2px;display:block}
#panel h2{margin:8px 0 2px;font-size:26px;font-weight:900;letter-spacing:.03em}
#panel .sub{margin:0 0 12px;font-weight:700;font-size:14px}
#panel .desc{margin:0 0 18px;font-size:13.5px;line-height:1.75;color:#4d4036}
.steps{list-style:none;margin:0;padding:0;position:relative}
.steps li{position:relative;padding:0 0 16px 40px}
.steps li::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps .n{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700}
.steps b{display:block;font-size:14px;margin-top:3px}
.steps span{display:block;font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:2px}
.steps li.go{cursor:pointer}
.steps li.go:hover b{text-decoration:underline}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tags span{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(43,33,25,.06)}

#tabs{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:6px;background:rgba(20,16,12,.35);padding:6px;border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{box-shadow:none;padding:8px 13px;white-space:nowrap;display:flex;align-items:center;gap:6px}
#tabs button i{width:8px;height:8px;border-radius:50%;display:block}
#tabs button.on{background:var(--ink);color:#fbefdc}
#hint{position:fixed;left:18px;bottom:24px;font-size:12px;color:rgba(251,239,220,.7);pointer-events:none}
body.day #hint{color:rgba(43,33,25,.6)}


.bub{position:absolute;left:0;top:0;pointer-events:auto;max-width:170px;background:#fffdf8;color:var(--ink);border-radius:12px;padding:5px 9px 6px;font-size:11.5px;line-height:1.35;box-shadow:0 4px 14px rgba(0,0,0,.28);border:2px solid #3ccf91;transition:opacity .3s}
.bub b{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);font-weight:700;white-space:nowrap}
.bub b i{width:7px;height:7px;border-radius:50%;background:#3ccf91;display:block;flex:none}
.bub span{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;width:9px;height:9px;background:#fffdf8;transform:translateX(-50%) rotate(45deg);border-right:2px solid;border-bottom:2px solid;border-color:inherit}
.bub.working i{animation:pulse 1.2s infinite}
.bub.meeting{border-color:#f2a541}.bub.meeting i{background:#f2a541}
.bub.idle{border-color:#b9ada0;opacity:.82}.bub.idle i{background:#b9ada0}
.bub.error{border-color:#ef5a5a}.bub.error i{background:#ef5a5a}
.bub.hide{opacity:0;pointer-events:none}
.bub.mini{width:16px;height:16px;padding:0;border-radius:50%;background:#3ccf91;border:2px solid #fffdf8}
.bub.mini b,.bub.mini span{display:none}.bub.mini::after{display:none}
.bub.mini.meeting{background:#f2a541}.bub.mini.idle{background:#b9ada0}.bub.mini.error{background:#ef5a5a}
.bub.mini.working{animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.bub.talking{opacity:0!important;pointer-events:none}
.say{position:absolute;left:0;top:0;pointer-events:none;max-width:190px;background:#2b2119;color:#fbefdc;border-radius:12px;padding:6px 10px 7px;font-size:12px;line-height:1.45;font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.3);opacity:0;transition:opacity .25s;white-space:normal;z-index:3}
.say.on{opacity:1}
.say small{display:block;font-size:10px;color:#f2a541;font-weight:700;margin-bottom:1px}
.say::after{content:"";position:absolute;left:50%;bottom:-5px;width:9px;height:9px;background:#2b2119;transform:translateX(-50%) rotate(45deg)}
#chatlog{position:fixed;left:18px;bottom:48px;width:300px;pointer-events:none;display:flex;flex-direction:column;gap:4px}
#chatlog div{background:rgba(255,248,238,.9);color:var(--ink);border-radius:10px;padding:5px 10px;font-size:12px;line-height:1.45;box-shadow:0 3px 10px rgba(0,0,0,.18);animation:pop .3s ease}
#chatlog div b{color:#b0632a;margin-right:4px}
#chatlog div:nth-last-child(n+3){opacity:.6}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
#live{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;font-weight:700}
#live i{width:8px;height:8px;border-radius:50%;background:#b9ada0;display:block}
#live.ok i{background:#3ccf91;animation:pulse 1.6s infinite}
#live.stale i{background:#f2a541}
.staff{margin:18px 0 6px;padding-top:14px;border-top:1px solid var(--line)}
.staff h3{margin:0 0 10px;font-size:14px}
.staff div{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
.staff div i{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.staff div b{flex:none;width:118px}
.staff div span{color:#4d4036;line-height:1.5}
@media (max-width:760px){
  #chatlog{left:10px;bottom:66px;width:62vw}#chatlog div{font-size:11px}#chatlog div:nth-last-child(n+3){display:none}
  .say{max-width:140px;font-size:11px}
  .bub{max-width:120px;font-size:10.5px;padding:4px 7px}

  header{top:10px;left:10px;right:10px;flex-direction:column}
  .brand{padding:10px 14px}
  .brand h1{font-size:16px}
  .tools button{padding:7px 12px;font-size:12px}
  #panel{top:auto;left:10px;right:10px;bottom:70px;width:auto;max-height:52vh;transform:translateY(calc(100% + 90px));border-radius:20px}
  #hint{display:none}
  #tabs{bottom:12px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>

<header>
  <div class="brand">
    <h1><b></b>我的 AI 3D 總部</h1>
    <p>你當投資人 · Claude 當 CEO · 四間工作室同時在跑</p>
    <div id="live"><i></i><span>連線中…</span></div>
  </div>
  <div class="tools">
    <button id="bOverview">總覽</button>
    <button id="bMode">☀️ 切換白天</button>
    <button id="bSpin">自動旋轉</button>
  </div>
</header>

<aside id="panel" aria-live="polite"></aside>
<nav id="tabs"></nav>
<div id="chatlog"></div>
<div id="hint">拖曳旋轉 · 滾輪縮放 · 點房間看工作流程</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const $ = s => document.querySelector(s);

/* ---------------- content ---------------- */
const INFO = {
  trade:{color:'#f2a541',kicker:'ROOM 01',title:'交易作戰室',sub:'把 Sam 的心法，變成活得下來的模型',
    desc:'每週六 2140 Sam 的直播從這裡進來，一路被轉錄、分析、開會辯論，最後變成模擬倉的下單，再整理成一份完整報告。',
    steps:[['直播牆 · 祝融夫人','每天 09:35／21:35 巡邏 YouTube，發現 Sam 的新直播'],
           ['字幕機 · 蔡文姬','家裡的 RTX 3070 Ti 用 Whisper 把 313 集直播轉成逐字稿'],
           ['Gemini 桌 · 甘夫人','用 Gemini 看直播畫面，抓出 Sam 標的價位'],
           ['經營會議 · 諸葛亮','CEO 每天 11:37／17:37 開會，黃月英回測、甄姬拆招式、大喬對帳、星彩追表單'],
           ['模擬倉 · 糜夫人＋孫尚香','每 4 小時跑 4 個模擬帳戶；每 5 分鐘盯 Sam 的價位'],
           ['報告桌 · 貂蟬','每週日整理成一份完整週報，派下週工作']],
    tags:['生存第一','模擬倉先行','槓桿 2–3x','大賺小賠']},
  boss:{color:'#e86f55',kicker:'ROOM 02',title:'投資人辦公室',sub:'你是投資人，Claude 是 CEO',
    desc:'你不用盯盤。訂單紀錄每小時同步到牆上的儀表板，早晚各推播一次到手機，有任何和 Sam 方法不一樣的判斷都會回報。',
    steps:[['訂單儀表板','每小時同步一次下單紀錄'],
           ['手機推播 · 小喬','每天 08:00 和 20:00 把模擬倉成果推到手機'],
           ['只看一份報告','不看零散回報，只看貂蟬的完整整合版'],
           ['目標','可以賺錢、大賺小賠']],
    tags:['不用你二選一','CEO 自己判斷','有落差就回報']},
  shift:{color:'#7fa77a',kicker:'ROOM 03',title:'製程班表工坊',sub:'自己寫給團隊用的值班表',
    desc:'四班二輪的班表網頁從這張開發桌出發，每次更新都會先留下舊版備份，再推上 GitHub 給團隊使用。',
    steps:[['提出需求','想改什麼，直接說'],
           ['修改 index.html','Claude 在開發桌改程式'],
           ['版本號規則','小改動升 .x（例如 v7.1），大改動升主版號'],
           ['舊版留備份','換掉 index.html 前，先保留上一版'],
           ['推上 GitHub','DoraKichu/OTFAPE1，團隊直接打開使用']],
    tags:['日A / 夜A / 日B / 夜B','每班一人','登入彩蛋保留']},
  game:{color:'#8b6fd6',kicker:'ROOM 04',title:'遊戲休息區',sub:'RO Survivors 法師 + 自動選卡機器人',
    desc:'下班放鬆的地方。機器人照你的規則幫法師選卡、開寶箱、自動連刷，整晚的過程都寫進監控 Log，隔天再檢查。',
    steps:[['核心三技能','火箭術、冰箭術、雷擊術'],
           ['寶箱優先順序','一般地圖尋寶率優先；活動地圖改成傷害 > 拾取範圍 > 金幣'],
           ['特權全部用完','重抽、放逐、專注，每一場都用完'],
           ['不讓角色發呆','遊戲跳出暫停就自動按繼續'],
           ['監控 Log','每一場都留下紀錄']],
    tags:['自動選卡 v1.37','法師','自動連刷']},
  core:{color:'#3aa6a0',kicker:'HUB',title:'Claude 核心',sub:'四間工作室共用的大腦',
    desc:'不同的對話、不同的專案，都從這顆核心接出去。點下面任何一間，直接飛過去看那裡的流程。',
    steps:[['交易作戰室','直播 → 轉錄 → 分析 → 會議 → 模擬倉 → 報告','trade'],
           ['投資人辦公室','儀表板與早晚推播','boss'],
           ['製程班表工坊','改版 → 備份 → GitHub','shift'],
           ['遊戲休息區','自動選卡與連刷','game']],
    tags:['點房間看細節']}
};
const ORDER = ['core','trade','boss','shift','game'];

/* ---------------- renderer / scene ---------------- */
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1,1,1,-1,.1,400);
camera.position.set(40,34,40);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = .08;
controls.minZoom = .6; controls.maxZoom = 4;
controls.minPolarAngle = .45; controls.maxPolarAngle = 1.2;
controls.screenSpacePanning = true; controls.autoRotateSpeed = .7;
controls.target.set(0,0,0);

const hemi = new THREE.HemisphereLight(0xfff4e2, 0x3b2a1f, .8); scene.add(hemi);
const dir = new THREE.DirectionalLight(0xffe7c4, 1.2);
dir.position.set(14,30,22); dir.castShadow = true;
dir.shadow.mapSize.set(2048,2048);
Object.assign(dir.shadow.camera,{left:-20,right:20,top:20,bottom:-20,near:1,far:80});
dir.shadow.bias = -0.0006;
scene.add(dir);

/* ---------------- helpers ---------------- */
const F = .2;
const lamps=[], glass=[], bobbers=[], blinkers=[], flows=[], stations=[], pickables=[];
const mat = (c,o={}) => new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.75,metalness:0},o));
function add(p,geo,m,x,y,z,shadow=true){const mesh=new THREE.Mesh(geo,(m&&m.isMaterial)?m:mat(m));mesh.position.set(x,y,z);mesh.castShadow=shadow;mesh.receiveShadow=true;p.add(mesh);return mesh;}
const box=(p,w,h,d,m,x,y,z)=>add(p,new THREE.BoxGeometry(w,h,d),m,x,y+h/2,z);
const cyl=(p,rt,rb,h,m,x,y,z,s=24)=>add(p,new THREE.CylinderGeometry(rt,rb,h,s),m,x,y+h/2,z);
const sph=(p,r,m,x,y,z)=>add(p,new THREE.SphereGeometry(r,20,14),m,x,y,z);

function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function tex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');fn(g,w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const FONT = '"Noto Sans TC", system-ui, sans-serif';
const MONO = '"JetBrains Mono", ui-monospace, monospace';
const screenMat = t => new THREE.MeshBasicMaterial({map:t,toneMapped:false});

/* ---------------- textures ---------------- */

function drawCandles(g,x0,y0,w,h,seed,count){const r=rng(seed);let p=.5;const pts=[];const cw=w/count;for(let i=0;i<count;i++){const o=p;p=Math.min(.92,Math.max(.08,p+(r()-.47)*.12));const hi=Math.max(o,p)+r()*.05,lo=Math.min(o,p)-r()*.05;const up=p>=o;g.strokeStyle=g.fillStyle=up?'#3ccf91':'#ef5a5a';const cx=x0+i*cw+cw/2;g.lineWidth=2;g.beginPath();g.moveTo(cx,y0+h-hi*h);g.lineTo(cx,y0+h-lo*h);g.stroke();const top=y0+h-Math.max(o,p)*h,bh=Math.max(3,Math.abs(p-o)*h);g.fillRect(cx-cw*.32,top,cw*.64,bh);pts.push([cx,y0+h-p*h]);}g.strokeStyle='#f2a541';g.lineWidth=3;g.beginPath();pts.forEach((q,i)=>{const a=pts.slice(Math.max(0,i-5),i+1);const y=a.reduce((s,v)=>s+v[1],0)/a.length;i?g.lineTo(q[0],y):g.moveTo(q[0],y);});g.stroke();}

const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let down=null,hovered=null;
function pickAt(cx,cy){const r=canvas.getBoundingClientRect();ptr.x=((cx-r.left)/r.width)*2-1;ptr.y=-((cy-r.top)/r.height)*2+1;ray.setFromCamera(ptr,camera);const hit=ray.intersectObjects(pickables,true)[0];if(!hit)return null;let o=hit.object;while(o&&!o.userData.room)o=o.parent;return o?o.userData.room:null;}
canvas.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];});
canvas.addEventListener('pointerup',e=>{if(!down)return;const moved=Math.hypot(e.clientX-down[0],e.clientY-down[1]);down=null;if(moved>6)return;const k=pickAt(e.clientX,e.clientY);if(k)focus(k);});
canvas.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const k=pickAt(e.clientX,e.clientY);if(k!==hovered){hovered=k;canvas.classList.toggle('hover',!!k);Object.keys(R).forEach(r=>{if(r!==selected)R[r].floor.emissive.set(r===k?0x1a1006:0x000000);});}});

const pick=a=>a[Math.floor(Math.random()*a.length)];
const V3=(x,z)=>new THREE.Vector3(x,0,z);
const NODES={t1:V3(-9,-9.3),t2:V3(-5.7,-9.2),t3:V3(-3.05,-7),t3b:V3(-1.05,-7.2),t4:V3(-3,-3.7),t5:V3(-1,-5),t6:V3(-7.6,-3.65),t7:V3(-9.2,-6),t8:V3(-7,-1.1),
 cN:V3(0,-5),cS:V3(0,5),cW:V3(-5,0),cE:V3(5,0),hN:V3(0,-1.15),hS:V3(0,1.15),hW:V3(-1.15,0),hE:V3(1.15,0),
 b1:V3(1.5,-6.4),b2:V3(8.6,-6.3),b3:V3(6,-5.4),b4:V3(2.8,-3.6),b5:V3(9.3,-3.6),b6:V3(9,-9),b8:V3(6,-1.4),
 s1:V3(-1.4,5.6),s2:V3(-7.5,6),s5:V3(-5.6,1.4),g1:V3(1.4,5),g2:V3(4.5,5.5),g3:V3(8.6,5),g4:V3(6,1.4)};
const EDGES='t1-t2 t2-t3 t3-t3b t3-t5 t3-t4 t4-t5 t4-t6 t6-t7 t7-t1 t6-t8 t5-cN t8-cW cN-hN cS-hS cW-hW cE-hE hN-hE hE-hS hS-hW hW-hN b1-cN b1-b3 b1-b4 b3-b2 b2-b6 b3-b4 b3-b5 b4-b8 b5-b8 b8-cE s1-cS s1-s2 s2-s5 s5-cW g1-cS g1-g2 g2-g3 g2-g4 g3-g4 g4-cE'.split(' ');
const ADJ={};Object.keys(NODES).forEach(k=>ADJ[k]=[]);EDGES.forEach(e=>{const[a,b]=e.split('-');ADJ[a].push(b);ADJ[b].push(a);});
function nearest(p){let best=null,bd=1e9;for(const k in NODES){const d=NODES[k].distanceTo(V3(p.x,p.z));if(d<bd){bd=d;best=k;}}return best;}
function route(from,to){const a=nearest(from),b=nearest(to);const dist={},prev={},q=new Set(Object.keys(NODES));for(const k of q)dist[k]=1e9;dist[a]=0;
  while(q.size){let u=null;for(const k of q)if(u===null||dist[k]<dist[u])u=k;q.delete(u);if(u===b)break;for(const n of ADJ[u]){const d=dist[u]+NODES[u].distanceTo(NODES[n]);if(d<dist[n]){dist[n]=d;prev[n]=u;}}}
  const ids=[];let c=b;while(c){ids.unshift(c);if(c===a)break;c=prev[c];}
  const pts=ids.map(k=>NODES[k].clone());
  if(from.distanceTo(to)<2.2)return [to.clone()];
  pts.push(to.clone());return pts;}
const yawTo=(a,b)=>Math.atan2(b.x-a.x,b.z-a.z);

 {id:'arm1',pos:V3(4.5,-3.7),yaw:Math.PI/2,sit:F+.15,say:'坐一下'},
 {id:'arm2',pos:V3(7.5,-3.7),yaw:-Math.PI/2,sit:F+.15,say:'坐一下'},

const agents=[];const chatlogEl=$('#chatlog');
function logChat(name,text){const d=document.createElement('div');d.innerHTML=`<b>${esc(name)}</b>${esc(text)}`;chatlogEl.appendChild(d);while(chatlogEl.children.length>4)chatlogEl.firstChild.remove();}
Object.keys(SHORT).forEach(k=>{if(!seats[k])return;const g=seats[k].obj;scene.attach(g);
  for(let i=bobbers.length-1;i>=0;i--)if(bobbers[i].g===g)bobbers.splice(i,1);
  const yaw=new THREE.Euler().setFromQuaternion(g.quaternion,'YXZ').y;g.rotation.set(0,yaw,0);
  const seated=!!g.userData.seated;const pos=g.position.clone();
  const exit=seated?pos.clone().sub(new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)).multiplyScalar(.75)):pos.clone();exit.y=0;
  seats[k].dy=k==='zhuge'?1.78:1.6;
  const el=document.createElement('div');el.className='say';labelsEl.appendChild(el);
  agents.push({key:k,g,home:{pos,yaw,seated,exit},path:[],at:'home',wait:2+Math.random()*8,busy:false,el,sayT:0,yawGoal:yaw,poi:null,phase:Math.random()*6,next:null});});
const A=Object.fromEntries(agents.map(a=>[a.key,a]));
function taskOf(k){const s=STATUS&&(STATUS.staff||[]).find(x=>x.seat===k);return s?s:null;}
function stateOf(a){return a.g.userData.state||'idle';}
function say(a,text,dur=3){a.el.innerHTML=`<small>${esc(SHORT[a.key])}</small>${esc(text)}`;a.el.classList.add('on');a.sayT=dur;if(bubbles[a.key])bubbles[a.key].classList.add('talking');}
function stand(a){if(a.g.userData.seated){setPose(a.g,false);a.g.position.y=0;a.g.position.y=F;}}
function goTo(a,pos,yaw,opt={}){stand(a);const start=a.at==='home'&&a.home.seated?a.home.exit:a.g.position.clone();
  const pts=route(V3(start.x,start.z),V3(pos.x,pos.z));if(a.at==='home'&&a.home.seated)pts.unshift(V3(a.home.exit.x,a.home.exit.z));
  if(opt.viaExit)pts.splice(pts.length-1,0,V3(opt.viaExit.x,opt.viaExit.z));
  a.path=pts;a.at='walking';a.arrive={pos:pos.clone(),yaw,sit:opt.sit,then:opt.then};a.g.position.y=F;}
function goHome(a,then){if(a.at==='home'){if(then)then();return;}if(a.arrive&&a.arrive.home)return;goTo(a,a.home.pos,a.home.yaw,{sit:a.home.seated?a.home.pos.y:null,viaExit:a.home.seated?a.home.exit:null,then:()=>{a.at='home';if(then)then();}});a.arrive.home=true;}
function freePoi(){const used=new Set(agents.map(x=>x.poi).filter(Boolean));const c=POIS.filter(p=>!used.has(p.id));return c.length?pick(c):null;}
let chats=0;
function startChat(a){const cands=agents.filter(b=>b!==a&&!b.busy&&b.at!=='walking');if(!cands.length||chats>=2)return false;
  const b=pick(cands);a.busy=b.busy=true;chats++;
  const bp=b.g.position.clone();let dir=NODES[nearest(b.at==='home'&&b.home.seated?b.home.exit:bp)].clone().sub(V3(bp.x,bp.z));if(dir.length()<.1)dir.set(1,0,0);dir.y=0;dir.normalize();
  const spot=V3(bp.x,bp.z).add(dir.multiplyScalar(.85));
  a.poi=null;goTo(a,spot,yawTo(spot,bp),{then:()=>{a.at='chat';if(!b.g.userData.seated)b.yawGoal=yawTo(bp,a.g.position);converse(a,b);}});return true;}
function converse(a,b){const tb=taskOf(b.key),sb=stateOf(b);
  const lines=[[a,pick(OPEN).replace('{B}',SHORT[b.key])]];
  if(sb==='error'){lines.push([b,'出了點狀況：'+(tb?tb.task:'')]);lines.push([a,a.key==='zhuge'?'我記下來，會議上處理。':'需要幫忙嗎？我去跟諸葛亮說。']);}
  else{const t=tb&&tb.task?tb.task:'整理手邊的工作';lines.push([b,sb==='working'?t+'，忙著呢！':sb==='meeting'?t:t+'，先喘口氣～']);
    lines.push([a,pick(TALK[a.key]||CLOSE)]);if(Math.random()<.6)lines.push([b,pick(TALK[b.key]||CLOSE)]);lines.push([Math.random()<.5?a:b,pick(CLOSE)]);}
  let i=0;const step=()=>{if(i>=lines.length){a.busy=b.busy=false;chats--;a.at='idleSpot';a.wait=2+Math.random()*4;return;}
    const[who,txt]=lines[i++];say(who,txt,2.9);logChat(SHORT[who.key],txt);setTimeout(step,3000);};step();}
function decide(a){const st=stateOf(a);
  if(st!=='idle'){ // working / meeting / error: stay at station, occasional coffee break when working
    if(a.at!=='home'){goHome(a);return;}
    if(st==='working'&&Math.random()<.12){const c=POIS[0];if(!agents.some(x=>x.poi==='coffee')){a.poi='coffee';goTo(a,c.pos,c.yaw,{then:()=>{a.at='poi';say(a,c.say,2.5);a.wait=5;a.next='home';}});return;}}
    a.wait=20+Math.random()*30;return;}
  const r=Math.random();
  if(r<.4&&startChat(a))return;
  if(r<.8){const p=freePoi();if(p){a.poi=p.id;goTo(a,p.pos,p.yaw,{sit:p.sit,then:()=>{a.at='poi';if(Math.random()<.5)say(a,p.say,2.5);a.wait=7+Math.random()*9;}});return;}}
  a.poi=null;goHome(a,()=>{a.wait=12+Math.random()*16;});}
function agentsTick(dt,t){for(const a of agents){const g=a.g;
  if(a.sayT>0){a.sayT-=dt;if(a.sayT<=0){a.el.classList.remove('on');if(bubbles[a.key])bubbles[a.key].classList.remove('talking');}}
  const L=g.userData.limbs;
  if(a.at==='walking'&&a.path.length){const tgt=a.path[0];const dx=tgt.x-g.position.x,dz=tgt.z-g.position.z,d=Math.hypot(dx,dz);const sp=1.7*dt;
    if(d<=sp){g.position.x=tgt.x;g.position.z=tgt.z;a.path.shift();}else{g.position.x+=dx/d*sp;g.position.z+=dz/d*sp;a.yawGoal=Math.atan2(dx,dz);}
    a.phase+=dt*9;const sw=Math.sin(a.phase)*.6;L.legL.rotation.x=sw;L.legR.rotation.x=-sw;L.armL.rotation.x=-sw*.8;L.armR.rotation.x=sw*.8;g.position.y=F+Math.abs(Math.cos(a.phase))*.04;
    if(!a.path.length){const ar=a.arrive;g.position.y=F;L.legL.rotation.x=L.legR.rotation.x=L.armL.rotation.x=L.armR.rotation.x=0;
      if(ar){g.position.x=ar.pos.x;g.position.z=ar.pos.z;a.yawGoal=ar.yaw;if(ar.sit!=null&&ar.sit!==undefined){setPose(g,true);g.position.y=ar.sit;}a.at='arrived';const fn=ar.then;a.arrive=null;if(fn)fn();}}}
  else{ // idle animation
    if(g.userData.seated){const st=stateOf(a);if(st==='working'){L.armL.rotation.x=-.6+Math.sin(t*14+a.phase)*.12;L.armR.rotation.x=-.6+Math.cos(t*14+a.phase)*.12;}}
    if(!a.busy){a.wait-=dt;if(a.wait<=0){if(a.next==='home'){a.next=null;a.poi=null;goHome(a,()=>{a.wait=25+Math.random()*30;});}else decide(a);}}}
  let dy=a.yawGoal-g.rotation.y;dy=Math.atan2(Math.sin(dy),Math.cos(dy));g.rotation.y+=dy*Math.min(1,dt*8);}
  const w=innerWidth,h=innerHeight;
  for(const a of agents){if(a.sayT<=0)continue;a.g.getWorldPosition(v);v.y+=1.62+(a.key==='zhuge'?.18:0);v.project(camera);a.el.style.transform=`translate(${(v.x*.5+.5)*w}px,${(-v.y*.5+.5)*h}px) translate(-50%,-100%)`;}}

function applyOffset(){const w=innerWidth,h=innerHeight;camera.setViewOffset(w,h,offX,offY,w,h);camera.updateProjectionMatrix();}

/* ---------------- loop ---------------- */
const clock=new THREE.Clock();const v=new THREE.Vector3();let blinkT=0;
function tick(){const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  if(goal){const prev=controls.target.clone();controls.target.lerp(goal.target,.08);camera.position.add(controls.target.clone().sub(prev));camera.zoom+=(goal.zoom-camera.zoom)*.08;camera.updateProjectionMatrix();if(controls.target.distanceTo(goal.target)<.01&&Math.abs(camera.zoom-goal.zoom)<.005)goal=null;}
  const wantX=selected&&!isMobile()?190:0,wantY=selected&&isMobile()?innerHeight*.2:0;
  if(Math.abs(wantX-offX)>.5||Math.abs(wantY-offY)>.5){offX+=(wantX-offX)*.1;offY+=(wantY-offY)*.1;applyOffset();}
  controls.update();
  bobbers.forEach(b=>{const st=b.g.userData.state;const sp=st==='working'?6:st==='meeting'?3:st==='error'?9:1.2;b.g.position.y=b.base+Math.abs(Math.sin(t*sp+b.ph))*b.amp*(st==='working'?1.6:1);});
  agentsTick(dt,t);

  ring1.rotation.x=t*.9;ring1.rotation.y=t*.4;ring2.rotation.y=-t*.7;ring2.rotation.z=t*.5;
  head.rotation.y=Math.sin(t*1.3)*.5;
  blinkT+=dt;if(blinkT>.18){blinkT=0;blinkers.forEach(m=>m.emissiveIntensity=Math.random()<.75?1.3:.15);}
  flows.forEach(f=>{const n=f.dots.length;f.dots.forEach((d,i)=>{d.position.copy(f.curve.getPointAt(((t*f.speed)+i/n)%1));});});
  renderer.render(scene,camera);
  const w=innerWidth,h=innerHeight;
  labels.forEach(l=>{v.copy(l.pos).project(camera);const x=(v.x*.5+.5)*w,y=(-v.y*.5+.5)*h;l.el.style.transform=`translate(${x}px,${y}px) translate(-50%,-100%)`;if(l.room){l.el.classList.toggle('on',selected===l.room);}else{l.el.style.opacity=selected&&selected!=='core'?.55:1;}});
  const mini=camera.zoom<1.4;
  Object.keys(bubbles).forEach(k=>{bubbles[k].classList.toggle('mini',mini||bubbles[k].classList.contains('idle'));seats[k].obj.getWorldPosition(v);v.y+=seats[k].dy;v.project(camera);const x=(v.x*.5+.5)*w,y=(-v.y*.5+.5)*h;bubbles[k].style.transform=`translate(${x}px,${y}px) translate(-50%,-100%)`;});
  requestAnimationFrame(tick);}
